name: Make Hand-Drawn Documentary

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Narration file"
        required: true
        default: "scripts/example.txt"
      audio:
        description: "Optional narration audio file"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VIDEO_WIDTH: 1080
      VIDEO_HEIGHT: 1920
      VIDEO_FPS: 24
      SCENE_SECONDS: 5
      IMAGE_STEPS: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "CLOUDFLARE_ACCOUNT_ID is missing"
            exit 1
          }

          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "CLOUDFLARE_API_TOKEN is missing"
            exit 1
          }

      - name: Run tests
        run: pytest -q

      - name: Generate video
        env:
          SCRIPT_PATH: ${{ inputs.script }}
          AUDIO_PATH: ${{ inputs.audio }}
        shell: bash
        run: |
          if [ -n "$AUDIO_PATH" ]; then
            python reel.py \
              --script "$SCRIPT_PATH" \
              --audio "$AUDIO_PATH"
          else
            python reel.py \
              --script "$SCRIPT_PATH"
          fi

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: documentary-video
          path: output/documentary.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload scene artwork
        uses: actions/upload-artifact@v4
        with:
          name: documentary-scene-artwork
          path: generated_art/
          if-no-files-found: warn
          retention-days: 7
